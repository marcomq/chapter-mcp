[mcp_servers.chapter-mcp]
command = "./.venv/bin/chapter-mcp"
args = [
  "--root",
  ".",
]
cwd = "."
startup_timeout_sec = 20
required = false

[mcp_servers.chapter-mcp.tools.read_chapter_at]
approval_mode = "approve"

[mcp_servers.chapter-mcp.tools.list_files]
approval_mode = "approve"

[mcp_servers.chapter-mcp.tools.search]
approval_mode = "approve"

[mcp_servers.chapter-mcp.tools.read_chapter]
approval_mode = "approve"

[mcp_servers.chapter-mcp.tools.read_search]
approval_mode = "approve"
