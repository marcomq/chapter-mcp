[project]
name = "chapter-mcp"
version = "0.2.0"
description = "A structure-aware chapter search MCP server."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Marco Mengelkoch"}]
license = {text = "MIT"}
keywords = ["mcp", "search", "chapters", "fts5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastmcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/marcomq/chapter-mcp"
Repository = "https://github.com/marcomq/chapter-mcp"

[project.scripts]
chapter-mcp = "chapter_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
